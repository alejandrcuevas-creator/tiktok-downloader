<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader HD</title>
  <style>
    :root {
      --bg-dark: #0f0f12;
      --card-bg: #18181c;
      --accent: #ff0050;
      --accent-cyan: #00f2fe;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border: #2a2a30;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { max-width: 600px; width: 100%; margin-top: 40px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 2.2rem; background: linear-gradient(45deg, var(--accent), var(--accent-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: var(--text-sub); margin-top: 8px; }
    .input-box { background: var(--card-bg); padding: 8px; border-radius: 50px; border: 1px solid var(--border); display: flex; gap: 10px; margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 12px 20px; font-size: 1rem; }
    .input-box button { background: linear-gradient(45deg, var(--accent), #d60044); border: none; color: white; padding: 12px 28px; border-radius: 40px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .input-box button:hover { opacity: 0.9; }
    .result-card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 20px; display: none; text-align: center; }
    .video-preview { width: 100%; max-height: 400px; border-radius: 12px; margin-bottom: 15px; object-fit: cover; }
    .btn-group { display: flex; flex-direction: column; gap: 10px; }
    .btn-download { background: #25d366; color: white; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; display: block; }
    .btn-audio { background: #333; color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: bold; display: block; }
    .loading { display: none; text-align: center; margin: 20px 0; color: var(--accent-cyan); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>TikTok Downloader HD</h1>
      <p>Descarga videos sin marca de agua en alta definición</p>
    </div>

    <div class="input-box">
      <input type="text" id="videoUrl" placeholder="Pega el enlace de TikTok aquí...">
      <button onclick="fetchVideo()">Buscar</button>
    </div>

    <div class="loading" id="loading">Procesando video...</div>

    <div class="result-card" id="resultCard">
      <video id="videoPreview" class="video-preview" controls></video>
      <h3 id="videoTitle" style="margin-bottom: 15px; font-size: 1rem; font-weight: normal;"></h3>
      <div class="btn-group">
        <a id="dlNoWm" class="btn-download" target="_blank" download>Descargar Video sin Marca de Agua</a>
        <a id="dlAudio" class="btn-audio" target="_blank" download>Descargar Solo Audio (MP3)</a>
      </div>
    </div>
  </div>

  <script>
    async function fetchVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const loading = document.getElementById('loading');
      const resultCard = document.getElementById('resultCard');

      if (!url) {
        alert('Por favor ingresa un enlace válido de TikTok');
        return;
      }

      loading.style.display = 'block';
      resultCard.style.display = 'none';

      try {
        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.code === 0) {
          document.getElementById('videoPreview').src = data.data.play;
          document.getElementById('videoTitle').textContent = data.data.title || 'Video de TikTok';
          document.getElementById('dlNoWm').href = data.data.play;
          document.getElementById('dlAudio').href = data.data.music;
          resultCard.style.display = 'block';
        } else {
          alert('No se pudo obtener el video. Verifica que el enlace sea público.');
        }
      } catch (error) {
        alert('Ocurrió un error al conectar con el servidor.');
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
