<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Downloader HD - Alejandro Cuevas</title>
  <style>
    :root {
      --bg-dark: #0f0f12;
      --card-bg: #18181c;
      --accent-pink: #ff0050;
      --accent-cyan: #00f2fe;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border: #2a2a30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
    }

    .app-wrapper {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Panel Izquierdo / Perfil */
    .sidebar {
      width: 320px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .avatar-img {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent-cyan);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.35), 0 0 15px rgba(255, 0, 80, 0.4);
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }

    .avatar-img:hover {
      transform: scale(1.03);
    }

    .author-name {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(45deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .author-tag {
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Contenido Principal / Derecha */
    .main-content {
      flex: 1;
      padding: 50px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      font-size: 2.3rem;
      background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-sub);
      font-size: 1.05rem;
    }

    .search-container {
      width: 100%;
      max-width: 650px;
    }

    .input-box {
      background: var(--card-bg);
      padding: 8px 8px 8px 20px;
      border-radius: 50px;
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.5);
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
    }

    .input-box button {
      background: linear-gradient(45deg, var(--accent-pink), #d60044);
      border: none;
      color: white;
      padding: 14px 32px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: opacity 0.2s, transform 0.2s;
    }

    .input-box button:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .loading {
      display: none;
      text-align: center;
      margin: 20px 0;
      color: var(--accent-cyan);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 25px;
